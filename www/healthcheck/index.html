<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- No analytics.js here, so the daily canary doesn't count as a visit -->
<title>Goalie health check</title>
<style>body { font-family: system-ui, sans-serif; margin: 2rem; } li { margin: 0.25rem 0; }</style>
<script src="https://andrewmacheret.com/healthcheck.js"></script>
</head>
<body>
<h1>Goalie health check</h1>
<script>
// Google's OAuth review links to the about, privacy and terms pages, and the
// about page's heading has to match the app name exactly
healthcheck([
  { name: 'Page', url: '../', assets: true, contains: 'Goalie' },
  { name: 'About page', url: '../about.html', assets: true, contains: 'Daily Tracking - Goalie and Miler Lite</h1>' },
  { name: 'Privacy policy', url: '../privacy.html', contains: 'Privacy policy</h1>' },
  { name: 'Terms', url: '../terms.html', contains: 'Terms of service</h1>' }
]);
</script>
</body>
</html>
