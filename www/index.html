<!DOCTYPE html>
<html>
  <head>
    <title>Goalie</title>
    <script async src="https://andrewmacheret.com/analytics.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Goalie logs your daily goals to your own Google spreadsheet, one row a day.">
    <link rel="canonical" href="https://andrewmacheret.com/projects/goalie/">
    <link rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
      integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
      crossorigin="anonymous">
    <style type="text/css">
      .btn-outline-secondary:not(:disabled):not(.disabled):hover { background-color: #ddd; color: #333; }
      .btn-outline-secondary:not(:disabled):not(.disabled).active:hover { background-color: #333; color: #fff; } 
    </style>
  </head>
  <body>
    <div id="control" class="container mb-1">
      <div class="row">
        <div id="title" class="col">
          <span style="line-height: 1.62; font-size: 1.5rem;">
            <img src="goalie.png" class="img-fluid" style="width: 1.62rem; height: 1.62rem; vertical-align: text-bottom;" alt="🥅">
            Goalie
          </span>
        </div>
        <div id="auth" class="col">
          <span class="float-right">
            <button id="authorize-button" type="button" class="btn btn-success" style="display: none;">Authorize</button>
            <button id="signout-button" type="button" class="btn btn-outline-danger" style="display: none;">Sign Out</button>
            <a id="spreadsheet-link" href="#" target="_blank" style="display: inline-block;">
              <img src="sheets.png" class="img-fluid" style="width: 1.62rem; height: 1.62rem;" alt="📝">
            </a>
          </span>
        </div>
      </div>
    </div>

    <div id="sheet-controls" class="container mb-2">
      <div class="d-flex">
        <select id="sheet-select" class="custom-select mr-2" style="display: none;" aria-label="Spreadsheet"></select>
        <button id="remove-button" type="button" class="btn btn-outline-danger mr-2 flex-shrink-0" style="display: none;" title="Remove this spreadsheet from the list. It stays in your Google Drive">Remove</button>
        <div id="sheet-buttons" class="btn-group flex-shrink-0" style="display: none;">
          <button id="pick-button" type="button" class="btn btn-outline-secondary" title="Choose a spreadsheet from Google Drive">Open</button>
          <button id="create-button" type="button" class="btn btn-outline-secondary" title="Create a new Goalie spreadsheet">New</button>
          <button id="edit-button" type="button" class="btn btn-outline-secondary" title="Edit this spreadsheet's questions">Edit</button>
        </div>
      </div>
    </div>

    <div id="message-wrapper" class="container">
      <div id="message" class="alert alert-success" role="alert"></div>
    </div>

    <div id="form-wrapper" class="container">
      <form id="goalie-form" name="goalie-form" action="#" onsubmit="submitForm(); return false;" style="display: none;">
        <div class="form-group">
          <fieldset class="form-group">
            <div>
              <label class="font-weight-bold">Date</label>
            </div>
            <input type="date" class="form-control form-control-lg" id="date" name="date" value="" placeholder="mm/dd/yyyy" onkeypress="return dontSubmit(event)" />
          </fieldset>

          <div id="dynamic-fields"></div>

          <div id="dynamic-fields-templates" style="display: none;">
            <template id="template-radio" style="display: none;">
              <fieldset class="form-group">
                <div>
                  <label class="font-weight-bold">{{FIELD_LABEL}}</label>
                </div>
                <div id="{{CLASS}}-choices" class="btn-group btn-group-toggle flex-wrap" data-toggle="buttons">
                </div>
              </fieldset>
            </template>
            <template id="template-radio-choice" style="display: none;">
              <label class="btn btn-outline-secondary btn-lg {{BUTTON_ACTIVE}}" style="color: {{COLOR}}">
                <input type="radio" id="{{CLASS}}-{{INDEX}}" name="{{CLASS}}" value="{{VALUE}}" />
                {{LABEL}}
              </label>
            </template>

            <template id="template-checkbox" style="display: none;">
              <fieldset class="form-group">
                <div>
                  <label class="font-weight-bold">{{FIELD_LABEL}}</label>
                </div>
                <div id="{{CLASS}}-choices" class="btn-group btn-group-toggle flex-wrap" data-toggle="buttons">
                </div>
              </fieldset>
            </template>
            <template id="template-checkbox-choice" style="display: none;">
              <label class="btn btn-outline-secondary btn-lg {{BUTTON_ACTIVE}}" style="color: {{COLOR}}">
                <input type="checkbox" id="{{CLASS}}-{{INDEX}}" name="{{CLASS}}" value="{{VALUE}}" />
                {{LABEL}}
              </label>
            </template>

            <template id="template-text" style="display: none;">
              <fieldset class="form-group">
                <div>
                  <label class="font-weight-bold">{{FIELD_LABEL}}</label>
                </div>
                <input type="text" autocomplete="off" class="form-control form-control-lg" id="{{CLASS}}" name="{{CLASS}}" value="" placeholder="..." onkeypress="return dontSubmit(event)" />
              </fieldset>
            </template>

            <template id="template-decimal" style="display: none;">
              <fieldset class="form-group">
                <div>
                  <label class="font-weight-bold">{{FIELD_LABEL}}</label>
                </div>
                <input type="number" step="{{DECIMAL_STEP}}" class="form-control form-control-lg" id="{{CLASS}}" name="{{CLASS}}" value="" placeholder="0" onkeypress="return dontSubmit(event)" />
              </fieldset>
            </template>
          </div>

          <div id="message-below" class="alert alert-success" role="alert"></div>

          <fieldset class="form-group">
            <button id="submit" class="btn btn-block btn-lg btn-primary" type="submit">Submit</button>
          </fieldset>
        </div>
      </form>

      <div id="editor" style="display: none;">
        <label for="editor-title" class="font-weight-bold">Spreadsheet name</label>
        <input id="editor-title" type="text" class="form-control mb-3">
        <div id="editor-questions"></div>
        <button id="editor-add" type="button" class="btn btn-outline-primary btn-block mb-3">Add question</button>
        <div class="d-flex mb-3">
          <button id="editor-save" type="button" class="btn btn-primary btn-lg flex-fill mr-2">Save</button>
          <button id="editor-cancel" type="button" class="btn btn-outline-secondary btn-lg">Cancel</button>
        </div>
      </div>

      <template id="template-editor-question">
        <div class="d-flex align-items-center mb-1">
          <span class="drag-handle mr-2 text-muted" title="Drag to reorder" style="cursor: grab; font-size: 1.25rem; user-select: none;">☰</span>
          <input type="text" class="form-control mr-2 q-name" placeholder="Question" aria-label="Question">
          <select class="custom-select mr-2 q-type" style="width: auto;" aria-label="Type"></select>
          <button type="button" class="btn btn-outline-danger q-remove">Remove</button>
        </div>
        <textarea class="form-control q-choices" rows="3" placeholder="One choice per line" aria-label="Choices"></textarea>
      </template>
    </div>

    <footer class="container mb-3 text-center small">
      <a href="about.html" class="text-muted">About</a> · <a href="privacy.html" class="text-muted">Privacy</a> · <a href="terms.html" class="text-muted">Terms</a>
    </footer>

    <script
      src="index.js"></script>

    <script
      async defer
      src="https://accounts.google.com/gsi/client"
      onload="handleClientLoad()"
      onerror="handleClientLoadError()">
    </script>

    <script async defer src="https://apis.google.com/js/api.js"></script>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"
      integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut"
      crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"
      integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k"
      crossorigin="anonymous"></script>
  </body>
</html>
